<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | typingWorld</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1366 height=768></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">necotapu</div>
        </div>
    </div>


    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script type="module">import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-auth.js";
        import { getDatabase, ref, push, set, get, update, onValue, onChildAdded, remove, onChildRemoved }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-database.js";
        import { getAnalytics }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-analytics.js";


        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        // Shows a temporary message banner/ribbon for a few seconds, or
        // a permanent error message on top of the canvas if type=='error'.
        // If type=='warning', a yellow highlight color is used.
        // Modify or remove this function to customize the visually presented
        // way that non-critical warnings and error messages are presented to the
        // user.
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            dataUrl: buildUrl + "/WebGL.data.unityweb",
            frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
            codeUrl: buildUrl + "/WebGL.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "typingWorld",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        // By default Unity keeps WebGL canvas render target size matched with
        // the DOM size of the canvas element (scaled by window.devicePixelRatio)
        // Set this to false if you want to decouple this synchronization from
        // happening inside the engine, and you would instead like to size up
        // the canvas DOM size and WebGL render target sizes yourself.
        // config.matchWebGLToCanvasSize = false;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:

            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";

            // To lower canvas resolution on mobile devices to gain some
            // performance, uncomment the following line:
            // config.devicePixelRatio = 1;

            unityShowBanner('WebGL builds are not supported on mobile devices.');
        } else {
            // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

            canvas.style.width = "1366px";
            canvas.style.height = "768px";
        }

        loadingBar.style.display = "block";

        var myGameInstance = null;
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                myGameInstance = unityInstance;
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

//######################################################
// ゲームデータ保存
//######################################################
const SCRIPT_ID = 'AKfycbxI79d1FhMhZDc_p2QDA-alSRMeXq7uulX6qvCGlzHx8wSY_JaKkmZtQpiYMxYsEni-Bg'
const CLIENT_ID = '1018693471402-00vuk8cocmrvo0kibf6iht0na9s9vabk.apps.googleusercontent.com'
const CLIENT_SECRET = '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'
const REFRESH_TOKEN = '1//04iINmdcuvo_cCgYIARAAGAQSNwF-L9Irx8PLrzfWXPKbWzriE8Rg0S3r8cjxCol6amwxPXoNZFvY-rrBvnRXeWfBnzCnWHnWRCk'
const TOKEN_URL = "https://oauth2.googleapis.com/token";

/// <summary>
/// アクセストークンを取得して返します。
/// </summary>
/// <remarks>
/// リフレッシュトークンとかなんだろねぇ〜
/// </remarks>
         async function getAccessToken() {
          const data = JSON.stringify({
            client_id: CLIENT_ID,
            client_secret: CLIENT_SECRET,
            refresh_token: REFRESH_TOKEN,
            grant_type: 'refresh_token',
          });
          const options = {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: data
          };
          const response = await fetch(TOKEN_URL, options);
          const responseData = await response.json();
          return responseData.access_token;
        }
        
/// <summary>
/// GASに保存データを送信します。
/// </summary>
/// <param name="data">GASに送るJSON形式のメッセージ文字列。データの内容はカンマ区切りで構成されています。</param>
/// <remarks>
/// GASでスプレッドシートの同じメールアドレスの行が更新される
/// </remarks>
        async function sendToNecoBase(data) {
            console.log("data:", data);
            try {
                const accessToken = await getAccessToken();
                const url = `https://script.googleapis.com/v1/scripts/${SCRIPT_ID}:run`;
                const sendData = JSON.stringify({
                    function: 'saveData',
                    parameters: [data] // data を配列に包んで渡す
                });
                const options = {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${accessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: sendData
                };

                const response = await fetch(url, options);
                const responseData = await response.json();
                console.log(responseData);
            } catch (error) {
                console.error("Error:", error);
            }
        }
        window.sendToNecoBase = sendToNecoBase;

/// <summary>
/// GAS (Google Apps Script) から受け取ったデータを処理し、ゲームの状態を更新します。
/// </summary>
/// <remarks>
/// GASから受け取るJSON形式は {}
/// </remarks>
        async function receiveFromNecoBase() {
            const email = 'demonstration@e-net.nara.jp'; // 実際には動的に取得するユーザーのメールアドレス
            const url = `https://script.googleapis.com/v1/scripts/${SCRIPT_ID}:run`;

            try {
                const accessToken = await getAccessToken(); // アクセストークンを取得
                const data = JSON.stringify({
                    function: 'loadData',
                    parameters: [email]
                });
                const options = {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${accessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: data
                };

                const response = await fetch(url, options);
                const responseData = await response.json();
                if (responseData.error) {
                    console.error("Error from GAS:", responseData.error);
                } else {
                    console.log("Data received successfully:", responseData);
                    myGameInstance.SendMessage('TitleScene', 'finishDataLoadGas', JSON.stringify(responseData));
                }
            } catch (error) {
                console.error("Error receiving data:", error);
            }
        }
        window.receiveFromNecoBase = receiveFromNecoBase;
        
/// <summary>
/// 拡張機能からのメッセージ受信
/// </summary>
/// <param name="event">受信データ</param>
/// <remarks>
/// 拡張機能からランキングデータとステータスデータをJSON形式でまとめて取得する。
/// </remarks>
        window.addEventListener('message', function (event) {
            // セキュリティを確保するために、信頼できるオリジンからのメッセージのみを受け入れる
            if (event.origin !== "http://127.0.0.1:8000" && event.origin !== "https://dreadmoz.github.io") {
                return;
            }

            // Content Scriptからのメッセージを確認する
            if (event.data && event.data.type === "FROM_EXTENSION") {
                console.log("Received data from extension:", event.data);

                // タイムアウトタイマーをキャンセル
                if (window.cancelRequestTimeout) {
                    window.cancelRequestTimeout();
                }

                // データが正しく受信できた場合の処理
                if (event.data.data && event.data.data.status === "success") {
                    // combinedDataの作成前にデータの存在をチェック
                    const hasRankingData = !!event.data.data.data.rankingData;
                    const hasStatusData = !!event.data.data.data.statusData;

                    if (hasRankingData && hasStatusData) {
                        const combinedData = {
                            rankingData: event.data.data.data.rankingData,
                            statusData: event.data.data.data.statusData
                        };
                        console.log("combinedData:", combinedData);
                        myGameInstance.SendMessage('TitleScene', 'finishDataLoad', JSON.stringify(combinedData));
                    } else {
                        // 不足しているデータに応じたエラーメッセージを出力
                        if (!hasRankingData) console.log("rankingData is missing.");
                        if (!hasStatusData) console.log("statusData is missing.");
                        myGameInstance.SendMessage('TitleScene', 'handleDataError', "Some data is missing.");
                    }
                } else {
                    // データが初期状態またはエラーである場合の処理
                    console.log("Data is in the initial state or an error occurred.");
                    myGameInstance.SendMessage('TitleScene', 'handleDataError', "Data is in the initial state or an error occurred.");
                }
            }
        });</script>
</body>
</html>
