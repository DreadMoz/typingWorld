<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | typingWorld</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1366 height=768></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">necotapu</div>
        </div>
    </div>


    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script type="module">import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-auth.js";
        import { getDatabase, ref, push, set, get, update, onValue, onChildAdded, remove, onChildRemoved }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-database.js";
        import { getAnalytics }
            from "https://www.gstatic.com/firebasejs/10.2.0/firebase-analytics.js";


        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        // Shows a temporary message banner/ribbon for a few seconds, or
        // a permanent error message on top of the canvas if type=='error'.
        // If type=='warning', a yellow highlight color is used.
        // Modify or remove this function to customize the visually presented
        // way that non-critical warnings and error messages are presented to the
        // user.
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Release.loader.js";
        var config = {
            dataUrl: buildUrl + "/Release.data.unityweb",
            frameworkUrl: buildUrl + "/Release.framework.js.unityweb",
            codeUrl: buildUrl + "/Release.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "typingWorld",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        // By default Unity keeps WebGL canvas render target size matched with
        // the DOM size of the canvas element (scaled by window.devicePixelRatio)
        // Set this to false if you want to decouple this synchronization from
        // happening inside the engine, and you would instead like to size up
        // the canvas DOM size and WebGL render target sizes yourself.
        // config.matchWebGLToCanvasSize = false;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:

            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";

            // To lower canvas resolution on mobile devices to gain some
            // performance, uncomment the following line:
            // config.devicePixelRatio = 1;

            unityShowBanner('WebGL builds are not supported on mobile devices.');
        } else {
            // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

            canvas.style.width = "1366px";
            canvas.style.height = "768px";
        }

        loadingBar.style.display = "block";

        var myGameInstance = null;
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                myGameInstance = unityInstance;
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

        // user 変数を auth 関数外で宣言
        let user;
        let db;

        /**
        *  認証 C#側から呼ぶ
        */
        function googleAuth() {
            const firebaseConfig = {
                // Firebaseの設定情報
                apiKey: "AIzaSyD2uf3ULaqZQLfYYQa-9QLdamelA0CwguE",
                authDomain: "firetyping-ad101.firebaseapp.com",
                databaseURL: "https://firetyping-ad101-default-rtdb.firebaseio.com",
                projectId: "firetyping-ad101",
                storageBucket: "firetyping-ad101.appspot.com",
                messagingSenderId: "658577906647",
                appId: "1:658577906647:web:09e85b0541ca715bf94992",
                measurementId: "G-D0NXRPYMNR"
            };

            //                const app = firebase.initializeApp(firebaseConfig); // Firebaseアプリを初期化
            //                const db = firebase.getDatabase(app);    // RealtimeDBに接続
            //                const provider = new firebase.auth.GoogleAuthProvider(); // Google 認証プロバイダー
            //                const authInstance = app.auth(); // Firebase Auth インスタンスを取得

            const app = initializeApp(firebaseConfig); // Firebaseアプリを初期化
            db = getDatabase(app);    // RealtimeDBに接続
            const provider = new GoogleAuthProvider(); // Google 認証プロバイダー
            const authInstance = getAuth(); // Firebase Auth インスタンスを取得

            //                authInstance.signInWithPopup(provider)
            signInWithPopup(authInstance, provider)
                .then((result) => {
                    // ログイン成功時の処理
                    user = result.user;
                    // ドメインが '@e-net.nara.jp' であることを確認
                    const emailDomain = user.email.split('@')[1];

                    if (emailDomain === 'e-net.nara.jp') {
                        user.providerData.forEach((profile) => {
                            myGameInstance.SendMessage('TitleScene', 'finishAuth');
                            const fullName = profile.displayName;
                            const parts = fullName.split(" ");
                            const firstName = parts[0];
                            const lastName = parts[1];
                            myGameInstance.SendMessage('mail', 'UpdateText', profile.email);
                            myGameInstance.SendMessage('Image', 'UpdateImage', profile.photoURL);
                            myGameInstance.SendMessage('firstName', 'UpdateText', firstName);
                            myGameInstance.SendMessage('lastName', 'UpdateText', lastName);
                        });
                    } else {
                        // ドメインが一致しない場合はログアウトする
                        authInstance.signOut().then(() => {
                            alert('いいネットならせんようのアプリです。');
                            // ログアウト後の処理、例えばログインページにリダイレクトする
                        });
                    }
                }).catch((error) => {
                    // サインインに失敗した時の処理
                    console.error("認証に失敗しました:", error);

                    alert(error.code);
                    alert(error.message);
                    alert(error.mail);
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    // the email of the user's account used.
                    const email = error.email;
                    // The AuthCredential type that was used.
                    // const credential = firebase.auth.GoogleAuthProvider.credentialFromError(error);
                });
        }
        // auth 関数をグローバルに公開
        window.googleAuth = googleAuth;

        // リファレンスをグローバルまたはモジュールスコープに定義
        var pathStatus, pathEquipment, pathInventory, pathMedals, pathKpm;

        function initFirebaseRefs(uid) {
            pathStatus = ref(db, "users/" + uid + "/status");
            pathEquipment = ref(db, "users/" + uid + "/equipment");
            pathInventory = ref(db, "users/" + uid + "/inventory");
            pathMedals = ref(db, "users/" + uid + "/medals");
            pathKpm = ref(db, "users/" + uid + "/kpm");
        }
        //######################################################
        // ゲームデータ取得
        //######################################################
        function loadFirebaseData() {
            if (user) {
                // User is signed in, see docs for a list of available properties
                // https://firebase.google.com/docs/reference/js/firebase.User
                const uid = user.uid;
                initFirebaseRefs(uid);

                // ユーザー情報取得
                user.providerData.forEach((profile) => {
                    const fullName = profile.displayName;
                    const parts = fullName.split(" ");
                    var firstName = parts[0];
                    // 第1引数はクラス名ではなくオブジェクト名なので注意
                    myGameInstance.SendMessage('GameManager', 'setUserName', firstName);
                });

                // データの存在を確認し、なければ初期化する
                onValue(pathStatus, (snapshot) => {
                    if (!snapshot.exists()) {
                        // ステータスデータがない場合は初期化する
                        initFirebaseData().then(() => {
                            fetchData(); // データの取得を開始
                        }).catch((error) => {
                            console.error('Init Firebase Data failed:', error);
                        });
                    } else {
                        fetchData(); // データが存在する場合、直ちに取得を開始
                    }
                });
            }
        }
        // getFirebaseData関数をグローバルに公開
        window.loadFirebaseData = loadFirebaseData;

        function fetchData() {
            Promise.all([
                get(pathEquipment).then(data => {
                    var msgEquipment = data.val();
                    var intArrayAsStringEquipment = msgEquipment.join(",");
                    myGameInstance.SendMessage('GameManager', 'setEquipment', intArrayAsStringEquipment);
                }),
                get(pathStatus).then(snapshot => {
                    var msg = snapshot.val();
                    var intArrayAsString = msg.join(",");
                    myGameInstance.SendMessage('GameManager', 'setStatus', intArrayAsString);
                }),
                get(pathInventory).then(data => {
                    var msgInventory = data.val();
                    var intArrayAsStringInventory = msgInventory.join(",");
                    myGameInstance.SendMessage('GameManager', 'setInventory', intArrayAsStringInventory);
                }),
                get(pathMedals).then(data => {
                    var msgMedals = data.val();
                    var intArrayAsStringMedals = msgMedals.join(",");
                    myGameInstance.SendMessage('GameManager', 'setMedals', intArrayAsStringMedals);
                }),
                get(pathKpm).then(data => {
                    var msgKpm = data.val();
                    var intArrayAsStringKpm = msgKpm.join(",");
                    myGameInstance.SendMessage('GameManager', 'setKpm', intArrayAsStringKpm);
                })
            ]).then(() => {
                myGameInstance.SendMessage('TitleScene', 'finishDataLoad');
            }).catch((error) => {
                console.error('An error occurred:', error);
            });
        }



        //######################################################
        // ゲームデータ初期化
        //######################################################
        function initFirebaseData() {
            return new Promise((resolve, reject) => {
                if (user) {
                    const uid = user.uid;

                    // すべてのset操作をPromiseで管理
                    Promise.all([
                        set(pathStatus, [30, 1, 150, 0, 0, 0, 0, 0, 0, 0]),
                        set(pathEquipment, new Array(7).fill(0)),
                        set(pathInventory, new Array(64).fill(0).map((v, i) => i === 0 ? 1 : v)),
                        set(pathMedals, new Array(100).fill(0)),
                        set(pathKpm, new Array(10).fill(0))
                    ])
                        .then(() => {
                            resolve(); // すべてのset操作が完了したらresolveを呼ぶ
                        })
                        .catch((error) => {
                            reject(error); // エラーが発生した場合はrejectを呼ぶ
                        });
                } else {
                    reject('User is not signed in');
                }
            });
        }

        // setFirebaseData 関数をグローバルに公開
        window.initFirebaseData = initFirebaseData;

        //######################################################
        // ゲームデータ保存
        //######################################################
        function saveFirebaseStatus(value) {
            if (user) {
                update(pathStatus, value).then(() => {
                    console.log('Status updated successfully.');
                }).catch((error) => {
                    console.error('Failed to update Status:', error);
                });
            }
        }
        window.saveFirebaseStatus = saveFirebaseStatus;

        function saveFirebaseEquipment(value) {
            if (user) {
                // カンマ区切りの文字列をオブジェクトに変換
                var dataObject = {};
                value.split(",").forEach(pair => {
                    var parts = pair.split(":");
                    dataObject[parts[0]] = parseInt(parts[1]);
                });
                console.log(dataObject);
                update(pathEquipment, dataObject).then(() => {
                    console.log('Equipment updated successfully.');
                }).catch((error) => {
                    console.error('Failed to update equipment:', error);
                });
            }
        }
        window.saveFirebaseEquipment = saveFirebaseEquipment;

        function saveFirebaseInventory(value) {
            if (user) {
                // カンマ区切りの文字列をオブジェクトに変換
                var dataObject = {};
                value.split(",").forEach(pair => {
                    var parts = pair.split(":");
                    dataObject[parts[0]] = parseInt(parts[1]);
                });
                update(pathInventory, dataObject).then(() => {
                    console.log('Inventory updated successfully.');
                }).catch((error) => {
                    console.error('Failed to update Inventory:', error);
                });
            }
        }
        window.saveFirebaseInventory = saveFirebaseInventory;

        function saveFirebaseMedals(value) {
            if (user) {
                update(pathMedals, value).then(() => {
                    console.log('Medals updated successfully.');
                }).catch((error) => {
                    console.error('Failed to update Medals:', error);
                });
            }
        }
        window.saveFirebaseMedals = saveFirebaseMedals;

        function saveFirebaseKpm(value) {
            if (user) {
                update(pathKpm, value).then(() => {
                    console.log('Kpm updated successfully.');
                }).catch((error) => {
                    console.error('Failed to update Kpm:', error);
                });
            }
        }
        window.saveFirebaseKpm = saveFirebaseKpm;</script>
</body>
</html>
