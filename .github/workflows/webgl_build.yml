name: Run the WebGL build
on:
  workflow_dispatch: {}

jobs:
  build:
    name: Run the WebGL build
    runs-on: ubuntu-latest
    steps:
      # ディスク使用状況をチェック
      - name: Check disk space before build
        run: df -h

      # 不要なDockerイメージとコンテナを削除
      - name: Clean up Docker
        run: |
          docker system prune -af
          docker volume prune -f

      # Node.jsのバージョンをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      # Unityプロジェクトをチェックアウト
      - name: Check out my unity project
        uses: actions/checkout@v2

      # Libraryフォルダのキャッシュ設定
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Unityプロジェクトのビルド
      - name: Run the WebGL build
        uses: game-ci/unity-builder@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          unityVersion: 2021.3.24f1
          versioning: Semantic  # セマンティックバージョニングを明示
          
      # ディスク使用状況を再度チェック
      - name: Check disk space after build
        run: df -h

      # WebGLビルドをGitHub Pagesにデプロイ
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
          branch: gh-pages
          folder: build

      # WebGLビルドをアーティファクトとしてアップロード
      - name: Upload the WebGL Build
        uses: actions/upload-artifact@v2
        with:
          name: Build
          path: build
